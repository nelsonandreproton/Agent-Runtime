[project]
name = "agent-runtime"
version = "0.1.0"
description = "Runs Claude Code / Cowork markdown agents on a local llama.cpp LLM and exposes them over A2A."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.9",
    "a2a-sdk==0.3.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
